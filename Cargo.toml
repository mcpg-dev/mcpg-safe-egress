[package]
name = "mcpg-safe-egress"
version = "0.1.0-beta.3"
edition = "2024"
license = "Apache-2.0"
description = "A strict outbound HTTP client for URLs that untrusted parties supply: refuses any destination that is not globally reachable per the IANA special-purpose registries, denies internal host names, pins the connection to the vetted addresses while keeping the hostname for TLS, never follows redirects, and reports failures as categories that never carry an address."

[dependencies]
bytes = "1"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# The TLS configuration is built once per client and handed to reqwest, so it
# must be the rustls that reqwest links.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
tokio = { version = "1", features = ["net", "time"] }
url = "2.5.8"

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
